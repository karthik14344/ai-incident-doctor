# Alert rules for the patient (KnowledgeAI).
#
# RULE FOR EVERY ANNOTATION: describe the SYMPTOM ONLY - what is observed and
# where. Never name a likely cause. These alerts are inputs to the incident
# doctor's evaluation; an annotation that hints at the cause leaks the answer
# and makes the measured accuracy meaningless.
#
# Labels: severity (critical|warning|info), service (the affected service).

groups:
  - name: knowledgeai-availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"gateway|ingestion|retrieval|llm"} == 0
        # 45 s: a deploy recreates a container in ~15 s and must not look like an outage.
        for: 45s
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: "{{ $labels.job }} is not answering Prometheus scrapes"
          description: "The /metrics endpoint of {{ $labels.job }} has failed every scrape for at least 45 seconds."

      - alert: RestartLoop
        # Docker's restart count, not the process start time: a deploy recreates the
        # container (count back to 0) and must not look like a crash loop.
        expr: |
          (max_over_time(aid_container_restart_count{service=~"gateway|ingestion|retrieval|llm"}[15m])
           - min_over_time(aid_container_restart_count{service=~"gateway|ingestion|retrieval|llm"}[15m])) >= 2
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} container restarted {{ $value }} times in 15 minutes"
          description: "Docker restarted the {{ $labels.service }} container {{ $value }} times within 15 minutes."

      - alert: ContainerOOMKilled
        expr: increase(aid_container_oom_kills_total{service=~"gateway|ingestion|retrieval|llm"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} container recorded an out-of-memory kill"
          description: "Docker reported {{ $value | printf \"%.0f\" }} OOM kills of this container in the last 10 minutes."

  - name: knowledgeai-errors
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum by (service) (rate(knowledgeai_http_requests_total{status=~"5..", endpoint!="/metrics"}[2m]))
            / sum by (service) (rate(knowledgeai_http_requests_total{endpoint!="/metrics"}[2m]))
          ) > 0.05
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} is answering {{ $value | humanizePercentage }} of requests with 5xx"
          description: "Share of 5xx responses from {{ $labels.service }} over the last 2 minutes is above 5%."

      - alert: ChatRequestsFailing
        expr: |
          (
            sum(rate(knowledgeai_chat_answers_total{outcome="error"}[3m]))
            / sum(rate(knowledgeai_chat_answers_total[3m]))
          ) > 0.02
        for: 30s
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: "{{ $value | humanizePercentage }} of chat requests ended in an error"
          description: "Chat requests whose answer stream ended in an error, over the last 3 minutes, above 2%."

      - alert: DownstreamCallFailures
        expr: sum by (service, target) (increase(knowledgeai_downstream_failures_total[2m])) > 0
        for: 20s
        labels:
          severity: warning
        annotations:
          summary: "calls from {{ $labels.service }} to {{ $labels.target }} are failing"
          description: "{{ $value | printf \"%.0f\" }} failed calls from {{ $labels.service }} to {{ $labels.target }} in the last 2 minutes."

      - alert: OllamaCallFailures
        expr: sum by (service, operation) (increase(knowledgeai_ollama_failures_total{reason!="fallback"}[2m])) > 0
        for: 20s
        labels:
          severity: warning
        annotations:
          summary: "Ollama {{ $labels.operation }} calls from {{ $labels.service }} are failing"
          description: "{{ $value | printf \"%.0f\" }} failed Ollama {{ $labels.operation }} calls in the last 2 minutes."

  - name: knowledgeai-latency-and-load
    rules:
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, service, endpoint) (
              rate(knowledgeai_http_request_duration_seconds_bucket{endpoint=~"/api/chat|/api/retrieval/search|/retrieve|/generate"}[2m])
            )
          ) > 15
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency of {{ $labels.service }} {{ $labels.endpoint }} is {{ $value | printf \"%.1f\" }}s"
          description: "95th percentile request duration over the last 2 minutes is above the 15 s threshold."

      - alert: NoTraffic
        expr: sum(rate(knowledgeai_http_requests_total{service="gateway", endpoint="/api/chat"}[30m])) == 0
        for: 30m
        labels:
          severity: info
          service: gateway
        annotations:
          summary: "no chat requests have reached the gateway for 30 minutes"
          description: "The gateway has served zero /api/chat requests in the last 30 minutes."

  - name: knowledgeai-resources
    rules:
      - alert: MemoryClimbing
        # 128 KiB/s sustained = ~7.5 MiB/min of steady growth for 3 minutes.
        # Ignores the first 10 minutes of a process: start-up allocation is not a trend.
        expr: |
          deriv(knowledgeai_process_resident_memory_bytes[5m]) > 131072
          and on (service)
            (time() - max by (service) (label_replace(process_start_time_seconds, "service", "$1", "job", "(.*)"))) > 600
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "resident memory of {{ $labels.service }} is growing by {{ $value | humanize1024 }}B/s"
          description: "Process memory of {{ $labels.service }} has risen steadily for at least 3 minutes."

      - alert: ContainerMemoryNearLimit
        expr: |
          (
            aid_container_memory_usage_bytes{service=~"gateway|ingestion|retrieval|llm"}
            / (aid_container_memory_limit_bytes{service=~"gateway|ingestion|retrieval|llm"} > 0)
          ) > 0.85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} is using {{ $value | humanizePercentage }} of its memory limit"
          description: "Container memory has been above 85% of the configured limit for 1 minute."

  - name: knowledgeai-retrieval-quality
    rules:
      - alert: EmbeddingFallbackActive
        expr: increase(knowledgeai_embedding_fallback_total[2m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "embedding fallback counter on {{ $labels.service }} rose by {{ $value | printf \"%.0f\" }} in 2 minutes"
          description: "knowledgeai_embedding_fallback_total increased on {{ $labels.service }}; it is expected to stay flat."

      - alert: ZeroChunkRetrievals
        expr: |
          (
            sum(rate(knowledgeai_zero_chunk_retrievals_total[5m]))
            / sum(rate(knowledgeai_retrieved_chunks_count[5m]))
          ) > 0.2
        for: 1m
        labels:
          severity: warning
          service: retrieval
        annotations:
          summary: "{{ $value | humanizePercentage }} of retrieval queries returned zero chunks"
          description: "Share of retrieval queries with an empty result over the last 5 minutes is above 20%."

      - alert: ChatAnswersRefused
        # Normally ~0%: the corpus covers the questions users ask.
        expr: |
          (
            sum(rate(knowledgeai_chat_answers_total{outcome="refused_scope"}[5m]))
            / sum(rate(knowledgeai_chat_answers_total[5m]))
          ) > 0.3
        for: 2m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: "{{ $value | humanizePercentage }} of chat questions were refused as outside the documents"
          description: "Share of chat answers refused by the scope guardrail over the last 5 minutes is above 30%."
