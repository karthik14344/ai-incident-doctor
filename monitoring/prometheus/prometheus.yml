# Prometheus for the patient stack. Targets are compose service names on the
# stack's network, not host addresses.
global:
  # 5 s so a fault shows up within seconds - the doctor's evidence windows and
  # the evaluation's time-to-report both depend on it.
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    stack: knowledgeai

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8000"] }]
  - job_name: ingestion
    static_configs: [{ targets: ["ingestion:8001"] }]
  - job_name: retrieval
    static_configs: [{ targets: ["retrieval:8002"] }]
  - job_name: llm
    static_configs: [{ targets: ["llm:8003"] }]
  - job_name: cadvisor
    scrape_interval: 10s
    static_configs: [{ targets: ["cadvisor:8080"] }]
    metric_relabel_configs:
      # Keep container series for this stack only; cAdvisor exports thousands.
      - source_labels: [container_label_com_docker_compose_project]
        regex: "aid"
        action: keep
  - job_name: alert-sink
    static_configs: [{ targets: ["alert-sink:9095"] }]
  - job_name: doctor
    static_configs: [{ targets: ["doctor:8100"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["prometheus:9090"] }]
