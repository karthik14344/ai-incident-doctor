# Every alert goes to alert-sink, which appends it to the incident trigger log.
route:
  receiver: alert-sink
  group_by: ["alertname", "service"]
  # Short waits: the doctor's clock (alert -> finished report) starts here.
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: alert-sink
    webhook_configs:
      - url: http://alert-sink:9095/alerts
        send_resolved: true
        max_alerts: 0

# No inhibit rules: every symptom reaches the trigger log. Deciding which one
# is the root is the doctor's job, not Alertmanager's.
