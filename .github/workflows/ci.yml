name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Job 1: every push and pull request, on GitHub's runners. Nothing here needs
  # a running service, Ollama or Docker Compose.
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the doctor's git collector tests read history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            patient/requirements.txt
            doctor/requirements.txt

      - name: Install
        run: |
          pip install -r patient/requirements.txt
          if [ -f doctor/requirements.txt ]; then pip install -r doctor/requirements.txt; fi
          pip install -r requirements-dev.txt

      - name: Lint and test (the same script the local pipeline runs)
        run: sh scripts/pipeline/verify.sh

  # Job 2: deploy. Only pushes to main, never pull requests, and only on the
  # self-hosted runner on the HP Pavilion (label "pavilion").
  deploy:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, pavilion]
    env:
      # Lives outside the checkout so it survives between runs (see README).
      AID_HOME: /opt/aid
      DEPLOY_LOG_PATH: /opt/aid/runtime/deploys.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # deploy.py diffs against the previous deployed SHA
          clean: false     # keep the DVC workspace (kb/) between runs

      - name: Machine configuration
        run: cp "$AID_HOME/.env" .env

      - name: Deploy (the same script the local pipeline runs)
        env:
          PIPELINE: github
          DEPLOY_REASON: "github run ${{ github.run_id }} (${{ github.actor }})"
        run: |
          python3 -m pip install --user -q -r requirements-dev.txt
          sh scripts/pipeline/deploy.sh "$GITHUB_SHA"
