# Model file for the agent team (AGAI) when it runs next to the doctor.
# AGAI reads it through its own CODEFIX_CONFIG setting (docker-compose.yml);
# AGAI's code and its own config/models.yaml are untouched. Delete the
# CODEFIX_CONFIG line in docker-compose.yml to go back to AGAI's models.
#
# Why: AGAI's own models (glm-5.3, glm-5.3-flash) need a paid Z.AI plan. The
# key the team uses here serves only the free flash models, so every role is
# moved onto them (probed 2026-11-21: glm-4.7-flash and glm-4.5-flash answer;
# glm-5.3, glm-5.3-flash and glm-4.6 report "Insufficient balance").
#
#   diagnoser, fixer  glm-4.7-flash  the stronger free model does the reasoning
#   manager           glm-4.5-flash  routing between 2-3 legal moves, thinking off
#   judge             glm-4.5-flash  AGAI requires the judge to differ from the
#                                    diagnoser and fixer (self-preference bias)
provider: zai

roles:
  manager:
    model: glm-4.5-flash
    thinking: false
    max_tokens: 2048
  diagnoser:
    model: glm-4.7-flash
    max_tokens: 16000
  fixer:
    model: glm-4.7-flash
    max_tokens: 16000
  judge:
    model: glm-4.5-flash
    max_tokens: 8000

# Free models: cost telemetry reads 0. An explicit row per model, because AGAI
# falls back to a prefix match for unknown models.
pricing:
  glm-4.7-flash: {input: 0.0, output: 0.0}
  glm-4.5-flash: {input: 0.0, output: 0.0}

pipeline:
  max_attempts: 3
  react_max_iterations: 8
  max_rediagnoses: 1
  rediagnose_below_confidence: 0.35
  test_timeout_s: 180
  allow_test_edits: false
  rag_k: 6
  prompt_variant: react
  persona: default
