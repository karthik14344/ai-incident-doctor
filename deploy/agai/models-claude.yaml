# Model file for the agent team (AGAI) on Claude, read through AGAI's own
# CODEFIX_CONFIG setting when .env sets AGAI_MODELS_FILE=/repo/deploy/agai/models-claude.yaml
# (on the GCP VM: instance metadata aid-env-AGAI_MODELS_FILE). AGAI's code is
# untouched: provider "anthropic" selects its own AnthropicLLM (official SDK,
# structured outputs, prompt caching). Key: ANTHROPIC_API_KEY.
#
# Basic models only (2026-11-24): the team runs on Claude Sonnet 5.5, not Opus.
# The doctor keeps its own model (DOCTOR_MODEL). Sonnet 5.5 always thinks; `effort`
# sets how much (default high), so every role sets it lower. `fallbacks: default`
# re-runs a refused request on a fallback model inside the same call
# (server-side, routed by refusal category).
#
#   manager           routing between 2-3 legal moves             -> Sonnet 5.5, effort low
#   diagnoser, fixer  ReAct over the repo / writing the patch      -> Sonnet 5.5, effort medium
#   judge             AGAI's benchmark LLM-as-judge, NOT used when fixing incidents.
#                     AGAI refuses to start unless it differs from the diagnoser and
#                     fixer, so it is the even smaller Claude Haiku 5.5.
provider: anthropic

roles:
  manager:
    model: claude-sonnet-5-5
    effort: low
    max_tokens: 8000
    fallbacks: default
  diagnoser:
    model: claude-sonnet-5-5
    effort: medium
    max_tokens: 16000
    fallbacks: default
  fixer:
    model: claude-sonnet-5-5
    effort: medium
    max_tokens: 16000
    fallbacks: default
  judge:
    model: claude-haiku-5-5
    effort: low
    max_tokens: 8000

# USD per 1M tokens (list prices). Haiku 5.5: prompts up to 100K tokens; no cache
# rows because the judge never runs on incidents.
pricing:
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  claude-haiku-5-5: {input: 0.10, output: 0.50}

pipeline:
  max_attempts: 3
  react_max_iterations: 8
  max_rediagnoses: 1
  rediagnose_below_confidence: 0.35
  test_timeout_s: 180
  allow_test_edits: false
  rag_k: 6
  prompt_variant: react
  persona: default
